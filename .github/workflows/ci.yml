name: CI

# Day-to-day checks run locally first (scripts/check.sh: fmt, clippy, tests and the audit
# checkers). CI runs them again on GitHub for every push to main, beta tags, pull requests and
# manual runs (owner, 2026-11-17: the repository is public, so the standard runners cost nothing).
# Releases are not made here: they are signed locally with the release key, which never goes to GitHub.
on:
  push:
    branches: [main]
    tags: ["hub-v*-beta*", "agent-v*-beta*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The store's tests run on Postgres (docs/plans/hub-core-v2.md §2.7): the Linux jobs get the database as a
    # service container and turn on `pg-tests`; macOS and Windows runners have no service containers, so
    # they skip the store tests (everything else runs there). Builds read the checked-in `.sqlx/` cache.
    services:
      postgres:
        image: ${{ startsWith(matrix.os, 'ubuntu') && 'timescale/timescaledb:2.32.0-pg17' || '' }}
        env:
          POSTGRES_PASSWORD: mc-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      SQLX_OFFLINE: "true"
      PG_TESTS: ${{ startsWith(matrix.os, 'ubuntu') && '--features maker-connect-hub/pg-tests' || '' }}
      DATABASE_URL: postgres://postgres:mc-ci@127.0.0.1:5432/postgres
    strategy:
      fail-fast: false
      matrix:
        # Where the agent and the hub run: a Pi or a server (Linux), and the desktops
        # makers use next to their machines.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Serial port headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        shell: bash
        run: cargo test --workspace --locked $PG_TESTS

      # `.sqlx/` must match the queries: checked against a database with every migration applied.
      - name: Query cache current (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo install sqlx-cli --version 0.9.1 --locked --no-default-features --features rustls,postgres
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -q -c "CREATE DATABASE mc_prepare"
          for f in $(find crates/hub/src -path '*/migrations/*.sql' | awk -F/ '{print $NF "\t" $0}' | sort | cut -f2); do
            psql "${DATABASE_URL%/postgres}/mc_prepare" -q -v ON_ERROR_STOP=1 -f "$f"
          done
          cd crates/hub && DATABASE_URL="${DATABASE_URL%/postgres}/mc_prepare" SQLX_OFFLINE=false \
            cargo sqlx prepare --check -- --all-targets --features pg-tests

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked

      # The agent, built for each platform, to put next to a machine without installing
      # Rust there: download it from the run's artifacts.
      - name: Build the agent
        run: cargo build --release -p maker-connect-agent --locked

      - name: Keep the agent
        uses: actions/upload-artifact@v4
        with:
          name: maker-connect-agent-${{ matrix.os }}
          path: |
            target/release/maker-connect-agent
            target/release/maker-connect-agent.exe
          if-no-files-found: error
          retention-days: 30
