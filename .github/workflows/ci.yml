name: CI

# Day-to-day checks run locally (fmt, clippy, tests, docs; scripts/build-downloads.sh for
# the agent). CI runs only for beta tags, pull requests and manual runs, not for every push
# to main: it costs budget.
on:
  push:
    tags: ["hub-v*-beta*", "agent-v*-beta*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Where the agent and the hub run: a Pi or a server (Linux), and the desktops
        # makers use next to their machines.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Serial port headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked

      # The agent, built for each platform, to put next to a machine without installing
      # Rust there: download it from the run's artifacts.
      - name: Build the agent
        run: cargo build --release -p maker-connect-agent --locked

      - name: Keep the agent
        uses: actions/upload-artifact@v4
        with:
          name: maker-connect-agent-${{ matrix.os }}
          path: |
            target/release/maker-connect-agent
            target/release/maker-connect-agent.exe
          if-no-files-found: error
          retention-days: 30
