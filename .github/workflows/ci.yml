name: CI

# Day-to-day checks run locally first (scripts/check.sh: fmt, clippy, tests and the audit
# checkers). CI runs them again on GitHub for every push to main, beta tags, pull requests and
# manual runs (owner, 2026-11-17: the repository is public, so the standard runners cost nothing).
# Releases are not made here: they are signed locally with the release key, which never goes to GitHub.
on:
  push:
    branches: [main]
    tags: ["hub-v*-beta*", "agent-v*-beta*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main: every run finishes (no grey runs, owner 2026-11-23); other branches: a newer push stops the older run
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Builds read the checked-in `.sqlx/` cache. The store's tests need Postgres: here they are listed as
    # ignored (no `pg-tests`); the job `store` below runs them.
    env:
      SQLX_OFFLINE: "true"
    strategy:
      fail-fast: false
      matrix:
        # Where the agent and the hub run: a Pi or a server (Linux), and the desktops
        # makers use next to their machines.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Serial port headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Hardware page data (#209)
        if: runner.os == 'Linux'
        run: python3 scripts/hardware-page.py --check

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked

      # The agent, built for each platform, to put next to a machine without installing
      # Rust there: download it from the run's artifacts.
      - name: Build the agent
        run: cargo build --release -p maker-connect-agent --locked

      - name: Keep the agent
        uses: actions/upload-artifact@v4
        with:
          name: maker-connect-agent-${{ matrix.os }}
          path: |
            target/release/maker-connect-agent
            target/release/maker-connect-agent.exe
          if-no-files-found: error
          retention-days: 30

  # The store's tests on Postgres (docs/archive/plans/hub-core-v2.md §2.7), in a job of their own on Linux, the one
  # runner with service containers (journal:V2-STORE-1:0008); the matrix above leaves them ignored.
  store:
    name: store (Postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: timescale/timescaledb:2.32.0-pg17
        env:
          POSTGRES_PASSWORD: mc-ci
          # As scripts/dev-db.sh: timescaledb-tune would allow 25, too few for the tests in parallel.
          TS_TUNE_MAX_CONNS: "100"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      SQLX_OFFLINE: "true"
      # The tests' own login, maker_connect_owner (a login in dev and CI only: sqlx::test makes a
      # database per test); their pools log in as maker_connect_hub (crate::store::pg::Pg::from_pool).
      DATABASE_URL: postgres://maker_connect_owner:mc-ci@127.0.0.1:5432/mc_test
      # The operator: the roles, the tests' database and the query cache's database only.
      SUPERUSER_URL: postgres://postgres:mc-ci@127.0.0.1:5432
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # pg_dump/pg_restore/psql of the server's version (17) for the backup tests (crate::backup): from
      # PostgreSQL's own apt repository (Ubuntu 24.04 has 16).
      - name: Serial port headers, PostgreSQL 17 client
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          # The runner's own PostgreSQL 16 comes first on PATH otherwise.
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -q ' 17\.'

      # As an operator provisions a hub's server (design storage-ops.md): the roles and the restore
      # template (scripts/db-roles.sql), the database owned by maker_connect_owner.
      - name: Roles and the tests' database
        run: |
          psql "$SUPERUSER_URL/postgres" -q -v ON_ERROR_STOP=1 -v hub_password=mc-ci -v owner_password=mc-ci \
            -f scripts/db-roles.sql
          psql "$SUPERUSER_URL/postgres" -q -c "CREATE DATABASE mc_test OWNER maker_connect_owner"

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # The printer of the /p/ws test: Prusa's own Connect SDK at the pinned commit.
      - name: Prusa Connect SDK
        run: |
          git init -q "$RUNNER_TEMP/prusa-sdk"
          git -C "$RUNNER_TEMP/prusa-sdk" fetch -q --depth 1 \
            https://github.com/prusa3d/Prusa-Connect-SDK-Printer.git 04c5bd5956e5fa59047e508a144eb198834ea3b7
          git -C "$RUNNER_TEMP/prusa-sdk" checkout -q FETCH_HEAD
          python3 -m venv "$RUNNER_TEMP/sdk-venv"
          "$RUNNER_TEMP/sdk-venv/bin/pip" install -q -e "$RUNNER_TEMP/prusa-sdk"

      - name: Store tests
        env:
          PRUSA_SDK_PYTHON: ${{ runner.temp }}/sdk-venv/bin/python
        # With the cameras (the .67 build): it must build, and the routes' snapshot (tests/routes.txt)
        # runs only in this build.
        run: cargo test -p maker-connect-hub --locked --features pg-tests,cameras

      # The reference of crates/connect-sdk/src/pyos.rs (CPython 3.13.12's os, os.path and shutil),
      # stdlib only, beside the runner's own python3 (`update-environment: false`).
      - name: CPython 3.13.12
        id: cpython
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.12"
          update-environment: false

      - name: Python's os functions against CPython 3.13.12
        env:
          PYOS_PYTHON: ${{ steps.cpython.outputs.python-path }}
        run: cargo test -p maker-connect-sdk --test pyos_reference --locked

      # The reference of crates/connect-sdk (fileinfo.rs, download.rs): the SDK at c0d7d233
      # (branch `websockets`, docs/design/wire.md; not the checkout above) with gcode-metadata at
      # the port's commit, on CPython 3.13.12; gcode-metadata's test files are the scenario's
      # print files.
      - name: SDK and gcode-metadata on CPython 3.13.12
        run: |
          git init -q "$RUNNER_TEMP/prusa-sdk-ref"
          git -C "$RUNNER_TEMP/prusa-sdk-ref" fetch -q --depth 1 \
            https://github.com/prusa3d/Prusa-Connect-SDK-Printer.git c0d7d233d4ce2081e6c020d2e98fb92ad9b51521
          git -C "$RUNNER_TEMP/prusa-sdk-ref" checkout -q FETCH_HEAD
          git init -q "$RUNNER_TEMP/gcode-metadata"
          git -C "$RUNNER_TEMP/gcode-metadata" fetch -q --depth 1 \
            https://github.com/prusa3d/gcode-metadata.git 7d8f25dfa21b1a1d61cc2a0ee70cb00281a80e7f
          git -C "$RUNNER_TEMP/gcode-metadata" checkout -q FETCH_HEAD
          "${{ steps.cpython.outputs.python-path }}" -m venv "$RUNNER_TEMP/sdk-313"
          "$RUNNER_TEMP/sdk-313/bin/pip" install -q "$RUNNER_TEMP/gcode-metadata"
          "$RUNNER_TEMP/sdk-313/bin/pip" install -q -e "$RUNNER_TEMP/prusa-sdk-ref"

      - name: fileinfo.py against the reference
        env:
          FILEINFO_PYTHON: ${{ runner.temp }}/sdk-313/bin/python
          FILEINFO_GCODES: ${{ runner.temp }}/gcode-metadata/tests/gcodes
        run: cargo test -p maker-connect-sdk --test fileinfo_reference --locked

      - name: download.py against the reference
        env:
          DOWNLOAD_PYTHON: ${{ runner.temp }}/sdk-313/bin/python
        run: cargo test -p maker-connect-sdk --test download_reference --locked

      # files.py (#236): the Filesystem, and on Linux the watching (inotify_simple's events
      # against ours from notify).
      - name: files.py against the reference
        env:
          FILES_PYTHON: ${{ runner.temp }}/sdk-313/bin/python
        run: cargo test -p maker-connect-sdk --test files_reference --locked

      # camera.py, camera_driver.py, camera_controller.py, camera_configurator.py (#206): a snapshot
      # goes with requests' own User-Agent, so requests at the version the port names
      # (src/camera.rs REQUESTS_USER_AGENT).
      - name: The SDK's camera modules against the reference
        env:
          CAMERA_PYTHON: ${{ runner.temp }}/sdk-313/bin/python
        run: |
          "$RUNNER_TEMP/sdk-313/bin/pip" install -q requests==2.32.5
          cargo test -p maker-connect-sdk --test camera_reference --locked

      # The engine's references (#186, #187, #189): OctoPrint 1.11.8's estimation.py (stdlib only) and
      # PrusaLink 171148ce with the SDK at its pin c0d7d233 (prusa-sdk-ref above), on CPython 3.13.12, with the
      # packages of the local reference/.venv-prusalink (reference-requirements.txt).
      - name: OctoPrint 1.11.8 and PrusaLink 171148ce
        run: |
          git init -q "$RUNNER_TEMP/octoprint"
          git -C "$RUNNER_TEMP/octoprint" fetch -q --depth 1 https://github.com/OctoPrint/OctoPrint.git refs/tags/1.11.8
          git -C "$RUNNER_TEMP/octoprint" checkout -q FETCH_HEAD
          git init -q "$RUNNER_TEMP/prusa-link"
          git -C "$RUNNER_TEMP/prusa-link" fetch -q --depth 1 \
            https://github.com/prusa3d/Prusa-Link.git 171148ce7dbc7f1fb0633ea519523f3258877e2e
          git -C "$RUNNER_TEMP/prusa-link" checkout -q FETCH_HEAD
          "${{ steps.cpython.outputs.python-path }}" -m venv "$RUNNER_TEMP/prusalink-313"
          "$RUNNER_TEMP/prusalink-313/bin/pip" install -q -r crates/engine/src/ports/prusalink/reference-requirements.txt

      - name: The estimator, M73 and the screen against the references
        env:
          ESTIMATION_PYTHON: ${{ steps.cpython.outputs.python-path }}
          ESTIMATION_OCTOPRINT: ${{ runner.temp }}/octoprint
          PRUSALINK_PYTHON: ${{ runner.temp }}/prusalink-313/bin/python
          PRUSALINK_SRC: ${{ runner.temp }}/prusa-link
          PRUSALINK_SDK_SRC: ${{ runner.temp }}/prusa-sdk-ref
        run: cargo test -p maker-connect-engine --features devices --lib --locked -- estimator_identical ports::prusalink

      # `.sqlx/` must match the queries: checked against a database with every migration applied.
      - name: Query cache current
        shell: bash
        run: |
          cargo install sqlx-cli --version 0.9.1 --locked --no-default-features --features rustls,postgres
          psql "$SUPERUSER_URL/postgres" -q -c "CREATE DATABASE mc_prepare"
          for f in $(find crates/hub/src -path '*/migrations/*.sql' | awk -F/ '{print $NF "\t" $0}' | sort | cut -f2); do
            psql "$SUPERUSER_URL/mc_prepare" -q -v ON_ERROR_STOP=1 -f "$f"
          done
          cd crates/hub && DATABASE_URL="$SUPERUSER_URL/mc_prepare" SQLX_OFFLINE=false \
            cargo sqlx prepare --check -- --all-targets --features pg-tests

