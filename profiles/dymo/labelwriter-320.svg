  <path d="M44 86h97" stroke="#2a2b2f" stroke-width="4"/>
  <path d="M14 98h34l2 9H16z" fill="#fff" stroke="#c9c6be" stroke-width="1"/>
  <path d="M20 101.5h16M20 104.5h22" stroke="#26272a" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="44" y="96" width="8" height="12" rx="2" fill="#2a2b2f"/>
  <!-- the feed button and its light -->
  <rect x="62" y="100" width="14" height="9" rx="2" fill="#8f918c" stroke="#73756f" stroke-width="1"/>
  <circle cx="86" cy="104.5" r="2" fill="#5fbfa9"/>
</svg>
