<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Drawing of a DYMO LabelWriter 320">
  <rect width="160" height="160" rx="16" fill="#e9e7e1"/>
  <ellipse cx="82" cy="134" rx="62" ry="5" fill="#d3d0c8"/>
  <!-- the light grey body: a wedge, low at the front, square at the back -->
  <path d="M22 130v-24q0-6 5-9l24-15h82q8 0 8 8v40q0 0-4 0H26q-4 0-4 0z" fill="#c8c9c4"/>
  <path d="M22 116h119" stroke="#a9aaa5" stroke-width="1.4"/>
  <!-- the tinted lid over the roll -->
  <path d="M50 84l14-36q2-6 9-6h56q8 0 10 8l2 34z" fill="#3e4652" opacity=".9"/>
  <path d="M62 76l10-26" fill="none" stroke="#7d8896" stroke-width="2.4" stroke-linecap="round"/>
  <!-- the label roll seen through the lid -->
  <circle cx="104" cy="64" r="16" fill="#eceae4" opacity=".7"/>
  <circle cx="104" cy="64" r="10" fill="none" stroke="#c9c6be" stroke-width="1" opacity=".8"/>
  <circle cx="104" cy="64" r="5" fill="#2b2d31" opacity=".8"/>
