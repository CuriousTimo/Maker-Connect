<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Drawing of a DYMO LabelWriter 450">
  <rect width="160" height="160" rx="16" fill="#e9e7e1"/>
  <ellipse cx="82" cy="134" rx="62" ry="5" fill="#d3d0c8"/>
  <!-- the silver base: low at the front, rising to the back -->
  <path d="M22 130v-22q0-8 8-12l18-8h76q14 0 16 14l2 24q0 4-4 4H26q-4 0-4 0z" fill="#b9bcc1"/>
  <path d="M22 116h120" stroke="#9ea2a8" stroke-width="1.4"/>
  <!-- the smoked lid: a dome over the roll -->
  <path d="M46 90q4-46 46-52q38-4 46 36l2 16z" fill="#3c3f45" opacity=".92"/>
  <path d="M56 80q6-30 36-36" fill="none" stroke="#7a7f88" stroke-width="2.4" stroke-linecap="round"/>
  <!-- the label roll seen through the lid -->
  <circle cx="102" cy="70" r="17" fill="#eceae4" opacity=".7"/>
  <circle cx="102" cy="70" r="11" fill="none" stroke="#c9c6be" stroke-width="1" opacity=".8"/>
  <circle cx="102" cy="70" r="5.5" fill="#2b2d31" opacity=".8"/>
  <path d="M86 76q-14 6-26 14" fill="none" stroke="#eceae4" stroke-width="3" opacity=".6"/>
  <!-- the lid's hinge line and the dark band where the label leaves -->
  <path d="M40 90h102" stroke="#2a2b2f" stroke-width="4"/>
  <!-- the label coming out of the front slot -->
  <path d="M14 98h34l2 9H16z" fill="#fff" stroke="#c9c6be" stroke-width="1"/>
  <path d="M20 101.5h16M20 104.5h22" stroke="#26272a" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="44" y="96" width="8" height="12" rx="2" fill="#2a2b2f"/>
  <!-- the feed button on the front -->
  <rect x="62" y="100" width="18" height="9" rx="4.5" fill="#8e9298" stroke="#6f7379" stroke-width="1"/>
  <circle cx="90" cy="104.5" r="2" fill="#5fbfa9"/>
</svg>
