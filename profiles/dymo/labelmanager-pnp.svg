<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Drawing of a DYMO LabelManager PnP">
  <rect width="160" height="160" rx="16" fill="#e9e7e1"/>
  <ellipse cx="80" cy="140" rx="54" ry="6" fill="#d3d0c8"/>
  <!-- the stand: a flat silver plate, and the neck up to the body -->
  <path d="M62 122h36v10H62z" fill="#8d949a"/>
  <path d="M36 132h90l-6 6H30z" fill="#c4c8cc"/>
  <!-- the body: a silver rim, the top left corner cut off -->
  <path d="M42 62L68 26q3-4 8-4h40q8 0 8 8v86q0 8-8 8H50q-8 0-8-8z" fill="#c4c8cc"/>
  <!-- the black face, stepped around the silver at the lower right -->
  <path d="M47 63L71 30q2-3 6-3h33v62H96q-10 0-10 10v20H53q-6 0-6-6z" fill="#2f3033"/>
  <!-- the tape slot and the cut button -->
  <rect x="110" y="38" width="10" height="5" rx="1" fill="#1c1d20"/>
  <rect x="98" y="17" width="18" height="6" rx="2" fill="#b4babf"/>
  <!-- the small window low on the face -->
  <path d="M62 104l2-8h16l-2 8z" fill="#5a5b60"/>
</svg>
