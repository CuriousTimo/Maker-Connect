brand = "DYMO"
model = "LabelWriter 450"
kind = "label"
firmware = "dymo-lw"   # DYMO's LabelWriter raster protocol, over USB (printer class)
dpi = 300
head_dots = 672        # 56 mm; a narrower label runs at one side of the head

[detect]
machine_type = "DYMO LabelWriter 450"   # as the agent reports it, from the USB product id

# Die-cut labels (width across the head × length along the roll), from DYMO's PPD for the
# 450 (dymo-cups-drivers); the printer cannot tell which roll is in: the owner chooses.
# DYMO keeps about 1.5 mm free at the edges. 99xxx is the European number, 30xxx/11xxx
# the American one of the same label.

