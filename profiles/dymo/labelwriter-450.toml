brand = "DYMO"
model = "LabelWriter 450"
kind = "label"
firmware = "dymo-lw"   # DYMO's LabelWriter raster protocol, over USB (printer class)
dpi = 300
head_dots = 672        # 56 mm; a narrower label runs at one side of the head

# The labels come from the port (HS1, `docs/briefs/hs1-lw450-geometry.md`): every `PageSize`
# choice of DYMO's PPD for the 450 (dymo-cups-drivers 1.4.0, `lw450.ppd`), with its own name and
# size (`maker_connect_engine::ports::geometry::lw450`). The printer cannot tell which roll is in:
# the owner chooses.
media_from_port = "lw450"

[detect]
machine_type = "DYMO LabelWriter 450"   # as the agent reports it, from the USB product id
printer_type = "dymo.labelwriter-450"   # its type over the Prusa Connect protocol (docs/design/wire.md)
