# Sources: Buddy (printer_model_data.hpp): MINI, code 120, version 2.1.0. Nozzle 295 less its margin of 15 (tools_buddy.cpp, Configuration_MINI.h); bed 110 less 10.
# Size: PrusaSlicer-settings-prusa-fff 2.5.14 (bed_shape, max_print_height).
brand = "Prusa"
model = "Original Prusa MINI/+"
kind = "fdm"
build_volume_mm = [180, 180, 180]
bed_origin_mm = [0, 0]
nozzle_mm = 0.4
firmware = "prusa-buddy"
max_nozzle_c = 280
max_bed_c = 100
motion = "bedslinger"
# PrusaSlicer's printer_model (and OrcaSlicer's, where it differs).
printer_models = ["MINI", "MINIIS", "Prusa MINI", "Prusa MINI IS"]

[detect]
model_code = 120
machine_type = "Prusa-MINI"
printer_type = "2.1.0"
