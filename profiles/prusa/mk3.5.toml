# Sources: Buddy (printer_model_data.hpp): MK3.5, code 230, version 1.3.5. Nozzle 305 less its margin of 15 (tools_xbuddy.cpp), bed 125 less 5.
# Size: PrusaSlicer-settings-prusa-fff 2.5.14 (bed_shape, max_print_height).
brand = "Prusa"
model = "Original Prusa MK3.5"
kind = "fdm"
build_volume_mm = [250, 210, 210]
bed_origin_mm = [0, 0]
nozzle_mm = 0.4
firmware = "prusa-buddy"
max_nozzle_c = 290
max_bed_c = 120
motion = "bedslinger"
# PrusaSlicer's printer_model (and OrcaSlicer's, where it differs).
printer_models = ["MK3.5", "MK3.5MMU3", "Prusa MK3.5"]

[detect]
model_code = 230
machine_type = "Prusa-MK3.5"
printer_type = "1.3.5"
