# Sources: Buddy: COREONEL, code 350, version 8.1.0; as the CORE One (Configuration_COREONEL.h).
# Size: PrusaSlicer-settings-prusa-fff 2.5.14 (bed_shape, max_print_height).
brand = "Prusa"
model = "Prusa CORE One L"
kind = "fdm"
build_volume_mm = [300, 300, 330]
bed_origin_mm = [0, 0]
nozzle_mm = 0.4
firmware = "prusa-buddy"
max_nozzle_c = 290
max_bed_c = 120
motion = "corexy"
# PrusaSlicer's printer_model (and OrcaSlicer's, where it differs).
printer_models = ["COREONEL", "COREONELMMU3", "Prusa CORE One L", "Prusa CORE One L HF"]

[detect]
model_code = 350
machine_type = "Prusa-COREONEL"
printer_type = "8.1.0"
