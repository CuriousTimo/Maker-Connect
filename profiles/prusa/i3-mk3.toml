# Sources: Prusa-Firmware (variants/MK3): PRINTER_MK3 300, CUSTOM_MENDEL_NAME "Prusa i3 MK3" (M115's MACHINE_TYPE), HEATER_0_MAXTEMP 305, BED_MAXTEMP 125; its menu goes to 10 and 5 below. (prusa/mk3 is an MK3 on upstream Marlin.)
# Size: PrusaSlicer-settings-prusa-fff 2.5.14 (bed_shape, max_print_height).
brand = "Prusa"
model = "Original Prusa i3 MK3"
kind = "fdm"
build_volume_mm = [250, 210, 210]
bed_origin_mm = [0, 0]
nozzle_mm = 0.4
firmware = "prusa"
max_nozzle_c = 295
max_bed_c = 120
motion = "bedslinger"
# PrusaSlicer's printer_model (and OrcaSlicer's, where it differs).
printer_models = ["MK3", "MK3MMU2", "MK3MMU3"]

[detect]
model_code = 300
machine_type = "Prusa i3 MK3"
printer_type = "1.3.0"
