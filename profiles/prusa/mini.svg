  <!-- base and the bed on it -->
  <rect x="26" y="112" width="102" height="22" rx="3" fill="#2f3033"/>
  <rect x="32" y="104" width="76" height="8" rx="1.5" fill="#8d949a"/>
  <rect x="32" y="104" width="76" height="2" rx="1" fill="#b4babf"/>
  <!-- the column and its arm -->
  <rect x="112" y="28" width="12" height="86" fill="#3a3b3f"/>
  <rect x="109" y="24" width="18" height="7" rx="1.5" fill="#ef6c2c"/>
