<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Drawing of an Original Prusa MINI">
  <rect width="160" height="160" rx="16" fill="#e9e7e1"/>
  <ellipse cx="80" cy="137" rx="60" ry="5" fill="#d3d0c8"/>
  <!-- bowden tube from the extruder on top of the column to the head -->
  <path d="M44 20C46 6 92 8 90 40" fill="none" stroke="#c9cdd1" stroke-width="3.2" stroke-linecap="round"/>
  <!-- the black base, its feet, and the Z motor under the column -->
  <rect x="24" y="108" width="112" height="24" rx="3" fill="#2c2d30"/>
  <rect x="24" y="108" width="112" height="3" rx="1.5" fill="#45464b"/>
  <path d="M28 132h10v3H28zM122 132h10v3h-10z" fill="#1d1e21"/>
  <!-- the bed on its Y carriage: heatbed and the gold sheet on it -->
  <rect x="56" y="104" width="64" height="4" fill="#45464b"/>
  <rect x="48" y="96" width="82" height="8" rx="1.5" fill="#8d949a"/>
  <rect x="48" y="94" width="82" height="4" rx="1.5" fill="#cdb779"/>
  <!-- the single Z column on the left, the extruder on top -->
  <rect x="30" y="26" width="13" height="82" fill="#3a3b3f"/>
  <path d="M34 30v74M39 30v74" stroke="#2a2b2e" stroke-width="1.2"/>
  <rect x="26" y="14" width="22" height="14" rx="3" fill="#fa6831"/>
  <circle cx="37" cy="21" r="3.6" fill="#2c2d30"/>
  <!-- the X arm reaching out to the right from the orange X carriage -->
  <rect x="44" y="50" width="84" height="3.4" rx="1.6" fill="#c4c8cc"/>
  <rect x="44" y="60" width="84" height="3.4" rx="1.6" fill="#c4c8cc"/>
  <rect x="26" y="44" width="24" height="26" rx="3" fill="#fa6831"/>
  <rect x="124" y="46" width="8" height="22" rx="2" fill="#fa6831"/>
  <!-- the head: orange body, its fan, the nozzle -->
  <rect x="78" y="38" width="26" height="36" rx="4" fill="#fa6831"/>
  <rect x="78" y="38" width="26" height="5" rx="2.5" fill="#ff8a5c"/>
  <circle cx="91" cy="56" r="8" fill="#2c2d30"/>
  <path d="M91 49v14M84 56h14" stroke="#4a4b50" stroke-width="1.4"/>
  <circle cx="91" cy="56" r="2.4" fill="#4a4b50"/>
  <path d="M86 74h10l-3 6h-4z" fill="#3a3b3f"/>
  <path d="M89.5 80h3l-1.5 4z" fill="#c9a043"/>
  <!-- the display in the front of the base, its knob beside it -->
  <rect x="88" y="112" width="44" height="18" rx="3" fill="#fa6831"/>
  <rect x="92" y="115" width="26" height="12" rx="1.5" fill="#1b1c1f"/>
  <path d="M95 119h12M95 123h18" stroke="#7d8790" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="125" cy="121" r="4" fill="#2c2d30"/>
  <circle cx="125" cy="121" r="1.4" fill="#5a5b60"/>
</svg>
