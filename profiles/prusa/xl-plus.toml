# Sources: Buddy: XL+ (xls), code 410, version 3.1.1, id XLP; as the XL.
# Size: PrusaSlicer-settings-prusa-fff 2.5.14 (bed_shape, max_print_height).
brand = "Prusa"
model = "Prusa XL+"
kind = "fdm"
build_volume_mm = [360, 360, 360]
bed_origin_mm = [0, 0]
nozzle_mm = 0.4
firmware = "prusa-buddy"
max_nozzle_c = 290
max_bed_c = 120
motion = "corexy"
# PrusaSlicer's printer_model (and OrcaSlicer's, where it differs).
printer_models = ["XLP1T", "XLP2T", "XLP5T"]

[detect]
model_code = 410
machine_type = "Prusa-XLP"
printer_type = "3.1.1"
