# Sources: Buddy: MK3.9, code 210, version 1.3.9; as the MK4.
# Size: PrusaSlicer-settings-prusa-fff 2.5.14 (bed_shape, max_print_height).
brand = "Prusa"
model = "Original Prusa MK3.9"
kind = "fdm"
build_volume_mm = [250, 210, 220]
bed_origin_mm = [0, 0]
nozzle_mm = 0.4
firmware = "prusa-buddy"
max_nozzle_c = 290
max_bed_c = 120
motion = "bedslinger"
# PrusaSlicer's printer_model (and OrcaSlicer's, where it differs).
printer_models = ["MK3.9", "MK3.9MMU3"]

[detect]
model_code = 210
machine_type = "Prusa-MK3.9"
printer_type = "1.3.9"
