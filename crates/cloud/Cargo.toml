[package]
name = "maker-connect-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
maker-connect-grbl = { path = "../grbl" }
maker-connect-label = { path = "../label" }
axum = { version = "0.8.9", features = ["ws"] }
barcoders = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
fs2 = "0.4"
futures-util = "0.3"
include_dir = "0.7.4"
qrcode = { version = "0.14", default-features = false }
maker-connect-protocol = { version = "0.1.0", path = "../protocol" }
rand = "0.8"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "fs", "io-util"] }
toml = "1.1.8"
# Only for its Layer trait: the API token in an address is read before routing.
tower = { version = "0.5.3", default-features = false }
# SpoolmanDB fetched, a Spoolman imported from or exported to.
ureq = { version = "2", features = ["json"] }
argon2 = "0.5"
sha2 = "0.10"
aes = "0.8"
ctr = "0.9"
ruzstd = "0.9.1"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
# A stand-in for Moonraker in the SimplyPrint tests.
tokio-tungstenite = "0.29"
