[package]
name = "maker-connect-inotify-simple"
description = "A port of inotify_simple 1.3.5 (Chris Billington, BSD-2-Clause) to Rust, as the Connect SDK uses it"
version.workspace = true
edition.workspace = true
# The port of a BSD-2-Clause library (its notice in LICENSE and src/lib.rs); the workspace is
# AGPL-3.0, which BSD-2-Clause code may be part of.
license = "BSD-2-Clause"

# ctypes' CDLL('libc.so.6'): the inotify calls exist on Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# reads what the reference's Python gives (`tests/reference.rs`) without our own json port
serde_json = { version = "1.0.154", features = ["preserve_order"] }
