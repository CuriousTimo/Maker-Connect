[package]
name = "maker-connect-sdk"
description = "A port of Prusa-Connect-SDK-Printer (websockets branch @ c0d7d233) to Rust"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
getrandom = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
# requests.Session (`util.py`, `models.py`): a blocking HTTP client, as the SDK's.
ureq = { version = "2", features = ["gzip"] }
# urllib3's deflate decoding; ureq decodes gzip only.
flate2 = "1"
# websocket-client (`ws.py`): a blocking WebSocket client in its own thread, as the SDK's.
tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
log = "0.4"
# camera_driver.py's `make_hash`: blake2b with a 9-byte digest, urlsafe base64.
blake2 = "0.10"
base64 = "0.22"
# CPython's repr(), int(), float() and str.strip() (src/camera.rs, src/configparser.rs); and
# fileinfo.py and download.py: gcode-metadata's get_metadata, its port of CPython's
# repr() for the OSError that command.py sends as `error=repr(err)`.
maker-connect-gcode-metadata = { path = "../gcode-metadata" }
# files.py's ordered dicts (`storage_dict`, a folder's `children`, `wds`).
indexmap = "2"

# src/pyos.rs: the errno numbers and strerror of its OSError, and os.access on POSIX.
libc = "0.2"
# os.statvfs (src/pyos.rs): the free and total space of a storage on every OS.
fs4 = "1.1"

# files.py's InotifyHandler watches through notify instead of inotify_simple (owner, 2026-11-25,
# #236: "volledig gebruik te maken van die rust notify voor alles. 1 codebase"); the translation
# of its events is ours, at the top of src/files.rs.
notify = "=9.0.0"

[dev-dependencies]
# reads what the reference's Python gives (tests/pyos_reference.rs) without our own json port
serde_json = { version = "1.0.154", features = ["preserve_order"] }
