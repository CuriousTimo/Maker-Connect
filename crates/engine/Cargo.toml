[package]
name = "maker-connect-engine"
description = "Maker Connect's engine: the machines, their orders and their reports, with a port per device below it. Used by the agent and inside the hub."
version.workspace = true
edition.workspace = true
license.workspace = true

# HS1 (`docs/archive/briefs/hs1-lw450-geometry.md`): `devices` (default) holds every port and every device
# or heavy dependency. Without it the engine is its core and the ports' geometry
# (`ports::geometry`, over the 450's pure PPD code), for the hub.
[features]
default = ["devices"]
devices = ["dep:maker-connect-device", "dep:fancy-regex", "dep:serde_json", "dep:md-5", "dep:minijinja", "dep:serialport", "dep:libc", "dep:windows-sys",
           "dep:png", "dep:nusb", "dep:maker-connect-grbl", "dep:hidapi"]

[dependencies]
maker-connect-protocol = { path = "../protocol" }
# The device contract (hub core v2, step 1): each port behind an adapter (`src/device/`).
maker-connect-device = { path = "../device", optional = true }
# Python `re` (lookaheads included) for the ported regexes (owner's approval M5).
fancy-regex = { version = "0.14", optional = true }

# The OctoPrint settings are JSON values (`ports/octoprint/settings.rs`).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"], optional = true }
# Python's hashlib.md5 (a ported OctoPrint test, and `Settings._process_custom_controls`).
md-5 = { version = "0.10", optional = true }

# Stand-in for Jinja2 (owner's approval, section D of the Marlin port): `Settings.loadScript`
# (`ports/octoprint/settings.rs`). Only the features whose Jinja2 counterparts scripts can use.
minijinja = { version = "2", optional = true, default-features = false, features = ["serde", "std_collections", "builtins", "multi_template", "macros", "loader", "adjacent_loop_items", "preserve_order"] }

# pyserial's stand-in (owner's approval M5) for `ports/octoprint/serial.rs`, and the `fcntl`/`poll`
# calls it and `util/platform` make.
serialport = { version = "4", default-features = false, optional = true }
libc = { version = "0.2", optional = true }

# The DYMO LabelManager PnP port (`ports/labelle/`, step 3b): `png` stands for Pillow's PNG
# decoder (`Image.open`) and `nusb` for pyusb's libusb1 backend (ours, as the owner approved the
# stand-ins; both are what `crates/label` used).
png = { version = "0.17", optional = true }
nusb = { version = "0.2", optional = true }

# The laser port (`ports/laserfoundry/`, step 3d): `crates/grbl`, over LaserFoundry's device and
# G-code crates (the library; the reference is the gnea/grbl wiki, and LaserFoundry where it is silent, CLAUDE.md *Lasers (GRBL)*). `serial` for LaserFoundry's own serial transport.
maker-connect-grbl = { path = "../grbl", features = ["serial"], optional = true }

# The DYMO M-series scale port (`ports/usbscale/`, step 3e, E1): hidapi 2.6.7, the OS's own HID on
# every platform (Linux hidraw through `basic-udev`, no libudev to link; Windows' HID API; macOS IOKit).
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev"], optional = true }
[target.'cfg(windows)'.dependencies]
# pyserial 3.5 `serialwin32.py`'s ctypes calls (`win32.py`), for `ports/octoprint/serialwin32.rs`
# and `util/platform`'s `SetHandleInformation` (#181), `winreg` for `serialList` (#182).
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Devices_Communication", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_System_Registry", "Win32_Security"] }
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"], optional = true }
[target.'cfg(target_os = "macos")'.dependencies]
hidapi = { version = "2.6.7", optional = true }

# The laser port's proof drives LaserFoundry's own `Link` and `gcode::frame` beside it
# (`ports/laserfoundry/proof.rs`); the same release `crates/grbl` is pinned to.
[dev-dependencies]
laserfoundry-device = { git = "https://github.com/CuriousTimo/laserfoundry", rev = "2f3f31176e35543da766707e467c3c0c43a3e19a" }
laserfoundry-gcode = { git = "https://github.com/CuriousTimo/laserfoundry", rev = "2f3f31176e35543da766707e467c3c0c43a3e19a" }
laserfoundry-doc = { git = "https://github.com/CuriousTimo/laserfoundry", rev = "2f3f31176e35543da766707e467c3c0c43a3e19a" }
laserfoundry-geom = { git = "https://github.com/CuriousTimo/laserfoundry", rev = "2f3f31176e35543da766707e467c3c0c43a3e19a" }
