[package]
name = "maker-connect-engine"
description = "Maker Connect's engine: the machines, their orders and their reports, with a port per device below it. Used by the agent and inside the hub."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
maker-connect-protocol = { path = "../protocol" }
# Python `re` (lookaheads included) for the ported regexes (owner's approval M5).
fancy-regex = "0.14"

# The OctoPrint settings are JSON values (`ports/octoprint/settings.rs`).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# Python's hashlib.md5 (a ported OctoPrint test, and `Settings._process_custom_controls`).
md-5 = "0.10"

# Stand-in for Jinja2 (owner's approval, section D of the Marlin port): `Settings.loadScript`
# (`ports/octoprint/settings.rs`). Only the features whose Jinja2 counterparts scripts can use.
minijinja = { version = "2", default-features = false, features = ["serde", "std_collections", "builtins", "multi_template", "macros", "loader", "adjacent_loop_items", "preserve_order"] }

# pyserial's stand-in (owner's approval M5) for `ports/octoprint/serial.rs`, and the `fcntl`/`poll`
# calls it and `util/platform` make.
serialport = { version = "4", default-features = false }
libc = "0.2"

# The DYMO LabelManager PnP port (`ports/labelle/`, step 3b): `png` stands for Pillow's PNG
# decoder (`Image.open`) and `nusb` for pyusb's libusb1 backend (ours, as the owner approved the
# stand-ins; both are what `crates/label` used).
png = "0.17"
nusb = "0.2"

# The laser port (`ports/laserfoundry/`, step 3d): `crates/grbl`, which is LaserFoundry v0.5.0's
# device and G-code crates and the link logic of its app. `serial` for LaserFoundry's own serial transport.
maker-connect-grbl = { path = "../grbl", features = ["serial"] }

# The DYMO M-series scale port (`ports/usbscale/`, step 3e, E1): hidapi 2.6.7, the OS's own HID on
# every platform (Linux hidraw through `basic-udev`, no libudev to link; Windows' HID API; macOS IOKit).
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev"] }
[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
hidapi = "2.6.7"

# The laser port's proof drives LaserFoundry's own `Link` and `gcode::frame` beside it
# (`ports/laserfoundry/proof.rs`); the same release `crates/grbl` is pinned to.
[dev-dependencies]
laserfoundry-device = { git = "https://github.com/Stitchwright/laserfoundry", rev = "61febdb5d18f08f299f8501e44656da047a2ab09" }
laserfoundry-gcode = { git = "https://github.com/Stitchwright/laserfoundry", rev = "61febdb5d18f08f299f8501e44656da047a2ab09" }
laserfoundry-doc = { git = "https://github.com/Stitchwright/laserfoundry", rev = "61febdb5d18f08f299f8501e44656da047a2ab09" }
laserfoundry-geom = { git = "https://github.com/Stitchwright/laserfoundry", rev = "61febdb5d18f08f299f8501e44656da047a2ab09" }
