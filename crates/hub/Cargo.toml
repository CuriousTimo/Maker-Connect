[package]
name = "maker-connect-hub"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "maker_connect_hub"
path = "src/lib.rs"

[[bin]]
name = "maker-connect-hub"
path = "src/main.rs"

[features]
# Network cameras over RTSP, the module `cameras` (docs/plans/cameras.md, "Network cameras").
cameras = ["dep:retina", "dep:bytes", "dep:url"]

# HS13: the LaserFoundry web fork, packed gzip into the binary. Needs `crates/hub/laser-design/`, made by
# `scripts/laserfoundry-web.sh`; without the feature the hub builds and serves "not built in" there.
laser-design = []

[[example]]
name = "mse_record"
required-features = ["cameras"]

[dependencies]
maker-connect-grbl = { path = "../grbl" }
maker-connect-label = { path = "../label" }
# HS1: the ports' geometry only (`ports::geometry`); no device code (`default-features = false`).
maker-connect-engine = { path = "../engine", default-features = false }
axum = { version = "0.8.9", features = ["ws"] }
barcoders = { version = "2", default-features = false, features = ["std"] }
base64 = "0.22"
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.17"
fs2 = "0.4"
futures-util = "0.3"
include_dir = "0.7.4"
qrcode = { version = "0.14", default-features = false }
maker-connect-protocol = { version = "0.2.0", path = "../protocol" }
maker-connect-update = { path = "../update" }
flate2 = "1"
tar = { version = "0.4", default-features = false }
rand = "0.8"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
# The hub chooses: Spoolman answers in its models' field order, so JSON objects keep their
# insertion order (the audit `spoolman::audit` compares it), whatever else is in the build.
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "fs", "io-util"] }
toml = "1.1.8"
# Only for its Layer trait: the API token in an address is read before routing.
tower = { version = "0.5.3", default-features = false }
# Network cameras (docs/plans/cameras.md): retina, the reference, at the version of reference/retina (2b6b7fe).
retina = { version = "=0.4.22", optional = true }
bytes = { version = "1", optional = true }
url = { version = "2", optional = true }
# SpoolmanDB fetched, a Spoolman imported from or exported to.
ureq = { version = "2", features = ["json"] }
argon2 = "0.5"
sha2 = "0.10"
aes = "0.8"
ctr = "0.9"
ruzstd = "0.9.1"

[dev-dependencies]
ring = "0.17"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
# A stand-in for Moonraker in the SimplyPrint tests.
tokio-tungstenite = "0.29"
# A JPG thumbnail to read, in the G-code tests.
jpeg-encoder = "0.6"
