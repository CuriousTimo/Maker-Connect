[package]
name = "maker-connect-label"
description = "Label printers for Maker Connect: labels as rasters, and the DYMO LabelManager's protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Printing over USB HID (the agent): the system's HID API, no driver, no root.
hid = ["dep:hidapi"]

[dependencies]
png = "0.17"

# USB HID: the system's own API on macOS and Windows; on Linux hidraw, found through /sys in
# pure Rust (no libudev), so the agent cross-builds for a Pi.
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2", optional = true, default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
hidapi = { version = "2", optional = true }
