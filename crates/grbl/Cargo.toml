[package]
name = "maker-connect-grbl"
description = "GRBL machines (lasers) for Maker Connect, through LaserFoundry's device and G-code crates"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The agent's real serial ports; the hub's virtual lasers do without.
serial = ["laserfoundry-device/serial"]

[dependencies]
maker-connect-protocol = { path = "../protocol" }
# LaserFoundry (MIT OR Apache-2.0), pinned to its v0.6.0 release (8f07f98).
laserfoundry-device = { git = "https://github.com/Stitchwright/laserfoundry", rev = "8f07f98dc5338f0d43df98f08ae6391896e5f96f" }
laserfoundry-gcode = { git = "https://github.com/Stitchwright/laserfoundry", rev = "8f07f98dc5338f0d43df98f08ae6391896e5f96f" }
# The machine and the frame's bounds (`gcode::frame`'s arguments), as the app builds them.
laserfoundry-doc = { git = "https://github.com/Stitchwright/laserfoundry", rev = "8f07f98dc5338f0d43df98f08ae6391896e5f96f" }
laserfoundry-geom = { git = "https://github.com/Stitchwright/laserfoundry", rev = "8f07f98dc5338f0d43df98f08ae6391896e5f96f" }
