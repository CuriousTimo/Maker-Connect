[package]
name = "maker-connect-grbl"
description = "GRBL machines (lasers) for Maker Connect, through LaserFoundry's device and G-code crates"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The agent's real serial ports; tests do without.
serial = ["laserfoundry-device/serial"]

[dependencies]
maker-connect-protocol = { path = "../protocol" }
serde_json = "1.0.154"
# LaserFoundry (MIT OR Apache-2.0): its v0.6.0 release (8f07f98) plus the fork branch maker-connect-grbl
# (2f3f311, CuriousTimo/laserfoundry: the RX buffer from `$I`, filled in one write, #168).
laserfoundry-device = { git = "https://github.com/CuriousTimo/laserfoundry", rev = "2f3f31176e35543da766707e467c3c0c43a3e19a" }
laserfoundry-gcode = { git = "https://github.com/CuriousTimo/laserfoundry", rev = "2f3f31176e35543da766707e467c3c0c43a3e19a" }
# The machine and the frame's bounds (`gcode::frame`'s arguments), as the app builds them.
laserfoundry-doc = { git = "https://github.com/CuriousTimo/laserfoundry", rev = "2f3f31176e35543da766707e467c3c0c43a3e19a" }
laserfoundry-geom = { git = "https://github.com/CuriousTimo/laserfoundry", rev = "2f3f31176e35543da766707e467c3c0c43a3e19a" }
