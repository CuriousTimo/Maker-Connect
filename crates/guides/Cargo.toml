[package]
name = "maker-connect-guides"
description = "Step-by-step guides for Maker Connect: the data model, the checks on what is saved, and a step as HTML"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# A line's text keeps only bold, italic and links (wiki Design: Guides).
ammonia = "4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
