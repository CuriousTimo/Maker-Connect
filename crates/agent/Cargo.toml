[package]
name = "maker-connect-agent"
description = "Maker Connect's module next to a machine: drives it and reports to the hub"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
getrandom = "0.2"
maker-connect-sdk = { path = "../connect-sdk" }
maker-connect-engine = { path = "../engine" }
maker-connect-protocol = { path = "../protocol" }
maker-connect-system = { path = "../system" }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = "2"
sha2 = "0.10"
tiny_http = "0.12"
log = "0.4"
# The serial ports for a Marlin and the USB device behind each (`serial_ports.rs`).
serialport = { version = "4", default-features = false, features = ["usbportinfo-location", "usbportinfo-interface"] }
nusb = "0.2"
# repr() of a str, for the errors the SDK sends as `repr(err)` (the download, `marlin.rs`): on
# every platform, as `marlin.rs` is built on every platform.
maker-connect-gcode-metadata = { path = "../gcode-metadata" }
# The Stream Deck (`deck.rs`, #190): deckhand, our fork of elgato-streamdeck (CLAUDE.md), without its
# default hidapi backend, so the engine's hidapi backend per system is the only one (deckhand FORK.md).
deckhand = { package = "elgato-streamdeck", git = "https://github.com/CuriousTimo/deckhand", rev = "ff550f1a9e0e68c7e9cf53f8c01a8ca14fdb878e", default-features = false }
# WireGuard inside the agent (`wireguard.rs`, #194): boringtun + smoltcp, the glue ported from onetun
maker-connect-wireguard = { path = "../wireguard" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
base64 = "0.13"
# text on the deck's keys, and the keys' pictures
ab_glyph = { version = "0.2", features = ["variable-fonts"] }
image = { version = "0.25", default-features = false }
# USB webcams (`camera.rs`, #94; owner: nokhwa on every OS): V4L2, Media Foundation, AVFoundation; no
# decoding (`default-features = false`); `camera-sync-impl` is nokhwa's own `unsafe impl Send for Camera`,
# for the thread that reads it.
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-native", "camera-sync-impl"] }

[dev-dependencies]
# The laser's commands tested against LaserFoundry's simulated GRBL (`laser.rs`).
maker-connect-grbl = { path = "../grbl" }
# A JPEG as a UVC camera gives it, for the `mjpeg2jpeg` tests (`camera.rs`).
jpeg-encoder = "0.6"
