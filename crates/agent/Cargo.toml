[package]
name = "maker-connect-agent"
description = "Maker Connect's module next to a machine: drives it and reports to the cloud"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
maker-connect-grbl = { path = "../grbl", features = ["serial"] }
maker-connect-protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = "4"
ureq = { version = "2", features = ["json"] }
