  <path d="M2 11.6H87" stroke="#000" stroke-width="0.25"/>

  <!-- Set up -->
  <text x="2" y="15" font-size="2.2" font-weight="700">SET UP</text>
  <text font-size="2" x="2" y="18.3"><tspan font-weight="700">1</tspan> Wi-Fi <tspan font-weight="700">Maker-Door-4B28</tspan></text>
  <text font-size="2" x="4.3" y="21">password <tspan font-weight="700">makerdoor</tspan></text>
  <text font-size="2" x="2" y="23.9"><tspan font-weight="700">2</tspan> The setup page opens by itself</text>
  <text font-size="1.8" x="4.3" y="26.4">if not: open <tspan font-weight="700">192.168.4.1</tspan></text>
  <text font-size="2" x="2" y="29.3"><tspan font-weight="700">3</tspan> Type the code into the hub</text>
  <text font-size="1.8" x="2" y="32.1">Page: door-4b28.local</text>
  <text font-size="1.8" x="2" y="34.7">Back to empty: hold <tspan font-weight="700">S2</tspan> for 10 s</text>
  <path d="M38.6 13V34.5" stroke="#000" stroke-width="0.25"/>

